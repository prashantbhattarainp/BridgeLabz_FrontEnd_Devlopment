<!DOCTYPE html>
<html lang="en">
<head>

  <title>CSS Selectors Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Selectors Practice</h1>
  </header>

  <main>
    <p>This is a paragraph styled with an element selector.</p>

    <p id="unique">This uses an ID selector.</p>

    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>

    <div class="container">
      <p>Inside container</p>
      <p>Second inside container</p>
    </div>
  </main>

  <footer>

  </footer>
