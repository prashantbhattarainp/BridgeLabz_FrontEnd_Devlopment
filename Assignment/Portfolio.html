<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Portfolio</title>
</head>
<body class="bg-light text-dark">
<div class="container text-center p-5">
<h1 class="fw-bold">John Doe</h1>
<p class="mb-3">Web Developer & Designer</p>
<img src="https://via.placeholder.com/150" class="img-fluid rounded-circle mb-4" alt="">
<div class="mb-3">
<button class="btn btn-primary me-2">Hire Me</button>
<button class="btn btn-outline-dark">Download CV</button>
</div>
<form class="mx-auto" style="max-width:400px;">
<input type="text" class="form-control mb-3" placeholder="Your Name">
<input type="email" class="form-control mb-3" placeholder="Your Email">
<textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
<button class="btn btn-success w-100">Send</button>
</form>
</div>
</body>
</html>
