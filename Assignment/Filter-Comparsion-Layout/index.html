<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="comparison">
    <figure>
      <img src="https://picsum.photos/400/250?random=1" alt="Before Image">
      <figcaption>Before</figcaption>
    </figure>
    <figure class="filtered">
      <img src="https://picsum.photos/400/250?random=2" alt="After Image">
      <figcaption>After (Filtered)</figcaption>
    </figure>
  </section>
</body>
</html>
