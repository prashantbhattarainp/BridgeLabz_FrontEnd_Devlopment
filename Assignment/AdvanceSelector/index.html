<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Advanced CSS Selectors</h1>

    <ul class="item-list">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
        <li>Fourth Item</li>
    </ul>

    <div class="links">
        <a href="https://example.com">Secure Link</a>
        <a href="http://example.com">Non-Secure Link</a>
    </div>

    <form>
        <input type="text" placeholder="Type something...">
        <input type="email" placeholder="Email address">
    </form>

    <div class="elements">
        <p class="desc">This is a paragraph for pseudo-element demo.</p>
        <p class="next">This paragraph is next to the previous one.</p>
        <p class="sibling">Another paragraph after both.</p>
    </div>
</body>
</html>
