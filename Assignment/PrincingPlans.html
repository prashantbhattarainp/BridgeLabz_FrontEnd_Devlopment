<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Pricing Plans</title>
</head>
<body>
<div class="container py-5">
<h2 class="text-center mb-5">Choose Your Plan</h2>
<div class="row g-4">
<div class="col-md-4">
<div class="card text-center p-3 shadow-sm">
<h4>Basic</h4>
<h2>Nrs 9/mo</h2>
<p>Access to limited features</p>
<button class="btn btn-outline-primary">Select</button>
</div>
</div>
<div class="col-md-4">
<div class="card text-center p-3 bg-primary text-white shadow-lg">
<h4>Pro</h4>
<h2>Nrs 29/mo</h2>
<p>All premium features</p>
<button class="btn btn-light">Select</button>
</div>
</div>
<div class="col-md-4">
<div class="card text-center p-3 shadow-sm">
<h4>Enterprise</h4>
<h2>Nrs 49/mo</h2>
<p>For large businesses</p>
<button class="btn btn-outline-primary">Select</button>
</div>
</div>
</div>
</div>
</body>
</html>
