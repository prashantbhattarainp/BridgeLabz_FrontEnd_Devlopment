<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Principles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="grid">
    <div class="box">
      <h2>Fluid Layouts</h2>
      <p>Use percentages and relative units for width and spacing.</p>
      <code>width: 80%;</code>
    </div>
    <div class="box">
      <h2>Flexible Media</h2>
      <p>Images and videos adjust within containers.</p>
      <code>img { max-width: 100%; }</code>
    </div>
    <div class="box">
      <h2>Breakpoints</h2>
      <p>Use media queries to adapt layout to screen size.</p>
      <code>@media (max-width: 600px) { ... }</code>
    </div>
  </main>
</body>
</html>
