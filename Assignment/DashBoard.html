<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Dashboard</title>
</head>
<body>
<div class="container py-5">
<div class="card p-4">
<h3 class="mb-4">User Notifications</h3>
<div class="alert alert-success">New message received!</div>
<div class="alert alert-info">Tip: Check your profile settings.</div>
<div class="alert alert-danger">Warning: Password expires soon.</div>
<div class="alert alert-warning alert-dismissible fade show" role="alert">
Action required! Update your info.
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div class="bg-light p-4 border rounded">
<h5>Summary</h5>
<p>3 unread messages, 1 alert pending.</p>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
