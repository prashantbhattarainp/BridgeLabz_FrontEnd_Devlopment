<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Task Tracker</title>
</head>
<body>
<div class="container py-3">
<h3>Tasks <span class="badge bg-secondary">3</span></h3>
<ul class="list-group">
<li class="list-group-item d-flex justify-content-between align-items-center">Finish Report <span class="badge bg-danger">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center">Update Website <span class="badge bg-warning text-dark">Medium</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center">Email Client <span class="badge bg-success">Low</span></li>
</ul>
<button class="btn btn-primary mt-4">Completed <span class="badge bg-light text-dark">1</span></button>
</div>
</body>
</html>
