<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Travel Agency</title>
</head>
<body>

<header class="bg-light py-4 text-center">
<h2>Explore the World with Us</h2>
</header>

<main class="container text-center my-4">
<section>
<div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">
<div class="carousel-item active" data-bs-interval="2000">
<img src="https://via.placeholder.com/800x400" class="d-block w-100" alt="Paris">
<div class="carousel-caption"><h5>Paris</h5></div>
</div>
<div class="carousel-item" data-bs-interval="2000">
<img src="https://via.placeholder.com/800x400" class="d-block w-100" alt="Maldives">
<div class="carousel-caption"><h5>Maldives</h5></div>
</div>
<div class="carousel-item" data-bs-interval="2000">
<img src="https://via.placeholder.com/800x400" class="d-block w-100" alt="Switzerland">
<div class="carousel-caption"><h5>Switzerland</h5></div>
</div>
</div>
<button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>
<button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>
</div>
</section>

<section class="my-4">
<div class="progress" style="height:25px;">
<div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:70%">70% Booked</div>
</div>
</section>
</main>

<footer class="bg-dark text-white text-center py-3">
<p>Contact: travel@agency.com | © 2025 Travel Agency</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
