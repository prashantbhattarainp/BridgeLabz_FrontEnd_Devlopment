<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <div class="carousel-item">
      <img src="https://imgs.search.brave.com/EFHrNEridEOEmx0xBQxXSNqqVGe-J5xW8D5lTSox_X8/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWdk/LWN0LmFlcGxjZG4u/Y29tLzEwNTZ4NjYw/L24vY3cvZWMvMTA3/NzE5L3JhbmdlLXJv/dmVyLWV4dGVyaW9y/LXNpZGUtZ2xhc3Mt/aG91c2luZy5qcGVn/P2lzaWc9MCZxPTgw" class="d-block w-100" alt="...">

    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
